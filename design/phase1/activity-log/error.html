<!doctype html>
<html lang="vi">
  <head>

    <title>Watchtower · Nhật ký · Lỗi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body class="bg-background font-sans text-foreground antialiased">

          >
          <nav class="flex items-center gap-1" aria-label="Mục chính">
            <a

                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"

                class="lucide lucide-calendar-days size-4 shrink-0"

                <path d="M12 14h.01"></path>

                <path d="M8 18h.01"></path>
                <path d="M12 18h.01"></path>
                <path d="M16 18h.01"></path></svg

            ><a

                height="24"

                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"

                <path d="M12 9v4l2 2"></path>

                <path d="M6.38 18.7 4 21"></path>
                <path d="M17.64 18.67 20 21"></path></svg

                xmlns="http://www.w3.org/2000/svg"

                height="24"
                viewBox="0 0 24 24"

                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"

                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg

            ><a
              href="../activity-log/data.html"
              aria-current="page"
              class="inline-flex h-9 items-center gap-2 rounded-lg px-3 text-sm font-medium outline-hidden transition-colors bg-secondary text-foreground"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-history size-4 shrink-0"
                aria-hidden="true"

                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <path d="M12 7v5l4 2"></path></svg

            type="button"
            aria-haspopup="menu"
            class="ml-auto flex h-10 cursor-pointer items-center gap-2.5 rounded-xl px-1 pr-2 outline-hidden hover:bg-item-hover"
          >
            <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-p2-bg text-sm font-semibold text-p2-tx">P</span
            ><span class="text-sm font-medium">Trương Hữu Phúc</span
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-chevrons-up-down size-4 text-muted shrink-0"
              aria-hidden="true"
            >
              <path d="m7 15 5 5 5-5"></path>
              <path d="m7 9 5-5 5 5"></path>
            </svg>
          </button>
        </header>
        <header class="sticky top-0 z-30 flex h-14 shrink-0 items-center gap-3 border-b border-border bg-surface px-4 lg:hidden">
          <span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-primary text-primary-foreground"
            ><svg viewBox="0 0 24 24" fill="currentColor" class="size-5" aria-hidden="true">

          <p class="min-w-0 truncate text-base font-semibold">Nhật ký</p>
          <button type="button" aria-label="Tài khoản" class="ml-auto cursor-pointer rounded-full outline-hidden">
            <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-p2-bg text-sm font-semibold text-p2-tx">P</span>
          </button>
        </header>
        <div class="flex-1 pb-20 lg:pb-0">
          <div class="space-y-4 p-4 sm:p-6">
            <div class="flex flex-wrap items-center gap-2">
              <h1 class="mr-2 w-full text-xl font-semibold lg:w-auto">Nhật ký thay đổi</h1>
              <label class="relative block w-full sm:w-64 lg:ml-auto"
                ><span class="sr-only">Tìm</span
                ><svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="24"
                  height="24"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-search pointer-events-none absolute top-1/2 left-3.5 size-4 -translate-y-1/2 text-muted"
                >
                  <circle cx="11" cy="11" r="8"></circle>
                  <path d="m21 21-4.3-4.3"></path></svg
                ><input
                  type="search"
                  placeholder="Tìm theo tên nhân viên"
                  class="h-11 w-full rounded-xl border border-border-strong bg-surface px-4 text-base text-foreground outline-hidden transition-colors placeholder:text-muted focus:border-focus focus:ring-2 focus:ring-focus md:h-10 md:text-sm pl-10"
              /></label>
              <div class="flex flex-wrap gap-2">
                <button
                  type="button"
                  class="group inline-flex h-10 w-fit max-w-full cursor-pointer items-center gap-2 rounded-xl border border-border-strong bg-surface px-3.5 text-sm outline-hidden transition-colors aria-expanded:border-focus aria-expanded:ring-2 aria-expanded:ring-focus"
                >
                  <span class="text-muted">Loại:</span><span class="truncate font-medium text-foreground">Tất cả</span
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-chevron-down size-4 text-muted transition-transform group-aria-expanded:rotate-180 shrink-0"
                    aria-hidden="true"
                  >
                    <path d="m6 9 6 6 6-6"></path>
                  </svg></button
                ><button
                  type="button"
                  class="group inline-flex h-10 w-fit max-w-full cursor-pointer items-center gap-2 rounded-xl border border-border-strong bg-surface px-3.5 text-sm outline-hidden transition-colors aria-expanded:border-focus aria-expanded:ring-2 aria-expanded:ring-focus"
                >
                  <span class="text-muted">Khoảng:</span><span class="truncate font-medium text-foreground">7 ngày qua</span
                  ><svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-chevron-down size-4 text-muted transition-transform group-aria-expanded:rotate-180 shrink-0"
                    aria-hidden="true"
                  >
                    <path d="m6 9 6 6 6-6"></path>
                  </svg>
                </button>
              </div>
            </div>
            <section class="overflow-hidden rounded-2xl border border-border bg-surface">
              <div role="alert" class="flex flex-col items-center gap-3 py-10 text-center">
                <div>
                  <p class="text-sm font-medium text-err-text">Không tải được nhật ký</p>
                  <p class="mt-1 text-sm text-muted">Mất kết nối mạng</p>
                </div>
                <button
                  type="button"
                  class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl min-h-10 px-4 py-2 text-sm font-medium transition-colors max-w-full text-center leading-tight outline-hidden disabled:cursor-not-allowed disabled:opacity-50 border border-border-strong bg-surface text-foreground hover:bg-button-hover"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-rotate-cw size-4 shrink-0"
                    aria-hidden="true"
                  >
                    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
                    <path d="M21 3v5h-5"></path></svg

                </button>

              <path d="M8 18h.01"></path>
              <path d="M12 18h.01"></path>
              <path d="M16 18h.01"></path></svg
            >Lịch tuần</a

              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-alarm-clock size-5 shrink-0"
              aria-hidden="true"
            >
              <circle cx="12" cy="13" r="8"></circle>
              <path d="M12 9v4l2 2"></path>
              <path d="M5 3 2 6"></path>
              <path d="m22 6-3-3"></path>
              <path d="M6.38 18.7 4 21"></path>
              <path d="M17.64 18.67 20 21"></path></svg
            >Đi trễ</a
          ><a href="../staff/data.html" class="flex flex-col items-center justify-center gap-1 text-xs text-muted"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-users size-5 shrink-0"
              aria-hidden="true"
            >
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg
            >Nhân viên</a
          ><a href="../activity-log/data.html" aria-current="page" class="flex flex-col items-center justify-center gap-1 text-xs font-medium text-primary"

              fill="none"

              stroke-linecap="round"

              <path d="M3 3v5h5"></path>
              <path d="M12 7v5l4 2"></path></svg
