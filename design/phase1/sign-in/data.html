<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchtower · Đăng nhập · Có dữ liệu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/app.css" />
  </head>
  <body class="bg-background font-sans text-foreground antialiased">
    <div id="app">
      <div class="relative flex min-h-screen flex-col items-center justify-center p-4">
        <div class="absolute top-4 right-4">
          <div
            role="tablist"
            aria-label="Ngôn ngữ"
            class="inline-flex w-fit max-w-full shrink-0 gap-1 rounded-xl bg-foreground/5 p-1 shadow-(--shadow-segment-track)"
          >
            <button
              type="button"
              role="tab"
              aria-selected="true"
              class="h-8 cursor-pointer whitespace-nowrap rounded-lg px-3 text-sm font-medium outline-hidden transition-[color,background-color,box-shadow] duration-150 bg-surface text-foreground shadow-(--shadow-segment-thumb)"
            >
              VI</button
            ><button
              type="button"
              role="tab"
              aria-selected="false"
              class="h-8 cursor-pointer whitespace-nowrap rounded-lg px-3 text-sm font-medium outline-hidden transition-[color,background-color,box-shadow] duration-150 text-foreground/75 hover:text-foreground"
            >
              EN
            </button>
          </div>
        </div>
        <div class="w-full max-w-sm">
          <div class="mb-8 flex flex-col items-center gap-4">
            <span class="flex size-12 items-center justify-center rounded-xl bg-primary text-primary-foreground"
              ><svg viewBox="0 0 24 24" fill="currentColor" class="size-7" aria-hidden="true">
                <rect x="4" y="4.5" width="11" height="4" rx="2"></rect>
                <rect x="9" y="10" width="11" height="4" rx="2"></rect>
                <rect x="4" y="15.5" width="7" height="4" rx="2"></rect></svg
            ></span>
            <h1 class="text-xl font-semibold">Đăng nhập Watchtower</h1>
          </div>
          <form class="space-y-4">
            <div class="space-y-1.5">
              <label for="u" class="block w-fit text-sm font-medium">Tên đăng nhập</label
              ><input
                id="u"
                class="h-11 w-full rounded-xl border border-border-strong bg-surface px-4 text-base text-foreground outline-hidden transition-colors placeholder:text-muted focus:border-focus focus:ring-2 focus:ring-focus md:h-10 md:text-sm h-12 md:h-12"
                value=""
                autocomplete="username"
              />
            </div>
            <div class="space-y-1.5">
              <label for="pw" class="block w-fit text-sm font-medium">Mật khẩu</label>
              <div class="relative">
                <input
                  id="pw"
                  type="password"
                  value=""
                  class="h-11 w-full rounded-xl border border-border-strong bg-surface px-4 text-base text-foreground outline-hidden transition-colors placeholder:text-muted focus:border-focus focus:ring-2 focus:ring-focus md:h-10 md:text-sm h-12 pr-11 md:h-12"
                  autocomplete="current-password"
                /><button
                  type="button"
                  aria-label="Hiện mật khẩu"
                  class="absolute top-1/2 right-1.5 inline-flex size-9 -translate-y-1/2 cursor-pointer items-center justify-center rounded-lg text-muted hover:bg-foreground/5 hover:text-foreground"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    class="lucide lucide-eye size-4 shrink-0"
                    aria-hidden="true"
                  >
                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <button
              type="button"
              class="inline-flex cursor-pointer items-center justify-center gap-2 rounded-xl min-h-10 px-4 py-2 text-sm font-medium transition-colors max-w-full text-center leading-tight outline-hidden disabled:cursor-not-allowed disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary-hover h-12 w-full"
            >
              Đăng nhập
            </button>
          </form>
          <p class="mt-6 text-center text-sm text-muted">Quên mật khẩu? Nhờ chủ quán đặt lại.</p>
        </div>
      </div>
    </div>

    <script src="../assets/static.js"></script>
  </body>
</html>
