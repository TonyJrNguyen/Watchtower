<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchtower · Hồ sơ của tôi · Rỗng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/app.css" />
  </head>
  <body class="bg-background font-sans text-foreground antialiased">
    <div id="app">
      <div class="flex min-h-screen flex-col">
        <header class="sticky top-0 z-30 hidden h-16 shrink-0 items-center gap-6 border-b border-border bg-surface px-6 lg:flex">
          <span class="flex min-w-0 items-center gap-2.5"
            ><span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-primary text-primary-foreground"
              ><svg viewBox="0 0 24 24" fill="currentColor" class="size-5" aria-hidden="true">
                <rect x="4" y="4.5" width="11" height="4" rx="2"></rect>
                <rect x="9" y="10" width="11" height="4" rx="2"></rect>
                <rect x="4" y="15.5" width="7" height="4" rx="2"></rect></svg></span
            ><span class="truncate text-sm font-semibold text-foreground">Watchtower</span></span
          >
          <nav class="flex items-center gap-1" aria-label="Mục chính">
            <a
              href="../availability/data.html"
              class="inline-flex h-9 items-center gap-2 rounded-lg px-3 text-sm font-medium outline-hidden transition-colors text-foreground/70 hover:bg-item-hover hover:text-foreground"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-calendar-check size-4 shrink-0"
                aria-hidden="true"
              >
                <path d="M8 2v4"></path>
                <path d="M16 2v4"></path>
                <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                <path d="M3 10h18"></path>
                <path d="m9 16 2 2 4-4"></path></svg
              >Lịch rảnh</a
            ><a
              href="../my-profile/data.html"
              aria-current="page"
              class="inline-flex h-9 items-center gap-2 rounded-lg px-3 text-sm font-medium outline-hidden transition-colors bg-secondary text-foreground"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-circle-user-round size-4 shrink-0"
                aria-hidden="true"
              >
                <path d="M18 20a6 6 0 0 0-12 0"></path>
                <circle cx="12" cy="10" r="4"></circle>
                <circle cx="12" cy="12" r="10"></circle></svg
              >Hồ sơ của tôi</a
            >
          </nav>
          <button
            type="button"
            aria-haspopup="menu"
            class="ml-auto flex h-10 cursor-pointer items-center gap-2.5 rounded-xl px-1 pr-2 outline-hidden hover:bg-item-hover"
          >
            <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-p2-bg text-sm font-semibold text-p2-tx">T</span
            ><span class="text-sm font-medium">Huỳnh Ngọc Trâm</span
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-chevrons-up-down size-4 text-muted shrink-0"
              aria-hidden="true"
            >
              <path d="m7 15 5 5 5-5"></path>
              <path d="m7 9 5-5 5 5"></path>
            </svg>
          </button>
        </header>
        <header class="sticky top-0 z-30 flex h-14 shrink-0 items-center gap-3 border-b border-border bg-surface px-4 lg:hidden">
          <span class="flex size-8 shrink-0 items-center justify-center rounded-lg bg-primary text-primary-foreground"
            ><svg viewBox="0 0 24 24" fill="currentColor" class="size-5" aria-hidden="true">
              <rect x="4" y="4.5" width="11" height="4" rx="2"></rect>
              <rect x="9" y="10" width="11" height="4" rx="2"></rect>
              <rect x="4" y="15.5" width="7" height="4" rx="2"></rect></svg
          ></span>
          <p class="min-w-0 truncate text-base font-semibold">Hồ sơ của tôi</p>
          <button type="button" aria-label="Tài khoản" class="ml-auto cursor-pointer rounded-full outline-hidden">
            <span class="flex size-8 shrink-0 items-center justify-center rounded-full bg-p2-bg text-sm font-semibold text-p2-tx">T</span>
          </button>
        </header>
        <div class="flex-1 pb-20 lg:pb-0">
          <div class="mx-auto w-full max-w-2xl space-y-4 p-4 sm:p-6">
            <div class="flex flex-wrap items-center gap-3">
              <h1 class="text-xl font-semibold max-lg:sr-only">Hồ sơ của tôi</h1>
              <span class="ml-auto"
                ><div
                  role="tablist"
                  aria-label="Tuần"
                  class="inline-flex w-fit max-w-full shrink-0 gap-1 rounded-xl bg-foreground/5 p-1 shadow-(--shadow-segment-track)"
                >
                  <button
                    type="button"
                    role="tab"
                    aria-selected="true"
                    class="h-8 cursor-pointer whitespace-nowrap rounded-lg px-3 text-sm font-medium outline-hidden transition-[color,background-color,box-shadow] duration-150 bg-surface text-foreground shadow-(--shadow-segment-thumb)"
                  >
                    Tuần này</button
                  ><button
                    type="button"
                    role="tab"
                    aria-selected="false"
                    class="h-8 cursor-pointer whitespace-nowrap rounded-lg px-3 text-sm font-medium outline-hidden transition-[color,background-color,box-shadow] duration-150 text-foreground/75 hover:text-foreground"
                  >
                    Tuần sau
                  </button>
                </div></span
              >
            </div>
            <section class="rounded-2xl border border-border bg-surface">
              <header class="px-5 pt-4 pb-2">
                <h2 class="text-base font-semibold">Vị trí đã làm</h2>
                <p class="mt-0.5 text-xs text-pretty text-muted">Các ca bạn đã làm, từ khi dùng hệ thống.</p>
              </header>
              <div class="flex flex-wrap gap-1.5 px-5 pb-4">
                <span class="inline-flex h-8 items-center gap-1.5 rounded-full bg-foreground/5 px-3 text-sm font-medium"
                  ><span class="size-2 shrink-0 rounded-full bg-p4-dot" aria-hidden="true"></span>Pha chế<span
                    class="text-xs font-normal tabular-nums text-muted"
                    >286h</span
                  ></span
                ><span class="inline-flex h-8 items-center gap-1.5 rounded-full bg-foreground/5 px-3 text-sm font-medium"
                  ><span class="size-2 shrink-0 rounded-full bg-p8-dot" aria-hidden="true"></span>Phụ trách<span
                    class="text-xs font-normal tabular-nums text-muted"
                    >96h</span
                  ></span
                ><span class="inline-flex h-8 items-center gap-1.5 rounded-full bg-foreground/5 px-3 text-sm font-medium"
                  ><span class="size-2 shrink-0 rounded-full bg-p5-dot" aria-hidden="true"></span>Phục vụ<span
                    class="text-xs font-normal tabular-nums text-muted"
                    >18h</span
                  ></span
                >
              </div>
            </section>
            <div class="rounded-2xl border border-border bg-surface"><p class="py-6 text-center text-sm text-muted">Tuần này bạn không có ca nào.</p></div>
          </div>
        </div>
        <nav
          class="fixed inset-x-0 bottom-0 z-30 grid h-16 border-t border-border bg-surface lg:hidden"
          style="grid-template-columns: repeat(2, minmax(0, 1fr))"
          aria-label="Mục chính"
        >
          <a href="../availability/data.html" class="flex flex-col items-center justify-center gap-1 text-xs text-muted"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-calendar-check size-5 shrink-0"
              aria-hidden="true"
            >
              <path d="M8 2v4"></path>
              <path d="M16 2v4"></path>
              <rect width="18" height="18" x="3" y="4" rx="2"></rect>
              <path d="M3 10h18"></path>
              <path d="m9 16 2 2 4-4"></path></svg
            >Lịch rảnh</a
          ><a href="../my-profile/data.html" aria-current="page" class="flex flex-col items-center justify-center gap-1 text-xs font-medium text-primary"
            ><svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-circle-user-round size-5 shrink-0"
              aria-hidden="true"
            >
              <path d="M18 20a6 6 0 0 0-12 0"></path>
              <circle cx="12" cy="10" r="4"></circle>
              <circle cx="12" cy="12" r="10"></circle></svg
            >Hồ sơ của tôi</a
          >
        </nav>
      </div>
    </div>

    <script src="../assets/static.js"></script>
  </body>
</html>
