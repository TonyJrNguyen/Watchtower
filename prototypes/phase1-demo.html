<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchtower: shift scheduling, Phase 1 demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--sunk:#E9EDEA;--ink:#1B2520;--muted:#5A6760;--line:#D5DCD7;
  --jade:#17664F;--jade-ink:#FFFFFF;--jade-soft:#DCEEE6;
  --amber:#8F5B06;--amber-soft:#FAECCF;--red:#A5312A;--red-soft:#F7DFDB;
  --slate:#34567C;--slate-soft:#E0E8F2;--r-s:5px;--r-m:9px;--r-l:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111714;--surface:#19211D;--sunk:#141B17;--ink:#E4EBE7;--muted:#98A69E;--line:#2D3832;
  --jade:#5DC29E;--jade-ink:#0D1A14;--jade-soft:#1B382D;
  --amber:#E2AD4C;--amber-soft:#382B12;--red:#E6796F;--red-soft:#3C1E1B;
  --slate:#91B1D6;--slate-soft:#1D2937;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111714;--surface:#19211D;--sunk:#141B17;--ink:#E4EBE7;--muted:#98A69E;--line:#2D3832;
  --jade:#5DC29E;--jade-ink:#0D1A14;--jade-soft:#1B382D;
  --amber:#E2AD4C;--amber-soft:#382B12;--red:#E6796F;--red-soft:#3C1E1B;
  --slate:#91B1D6;--slate-soft:#1D2937;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
body.locked{overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
h1{font-size:1.6rem;line-height:1.2;font-weight:700;margin:0 0 .3rem;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:600;margin:0}
p{margin:.3rem 0}
small{font-size:.78rem;color:var(--muted)}
.muted{color:var(--muted)}
.grow{flex:1}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:.45rem .85rem;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:.28rem .6rem;font-size:.85rem}
.btn.xs{padding:.12rem .45rem;font-size:.78rem}
.icon{border:0;background:transparent;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--muted);padding:.1rem .4rem;border-radius:var(--r-s)}
.icon:hover{background:var(--sunk)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:.3rem .7rem;cursor:pointer;font-size:.85rem;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* tags */
.tag{display:inline-block;font-size:.72rem;font-weight:500;line-height:1.3;padding:.1rem .45rem;border-radius:99px;white-space:nowrap;margin:.1rem .15rem .1rem 0;vertical-align:middle}
.tag.ok{background:var(--jade-soft);color:var(--jade)}
.tag.warn{background:var(--amber-soft);color:var(--amber)}
.tag.bad{background:var(--red-soft);color:var(--red)}
.tag.info{background:var(--slate-soft);color:var(--slate)}
.tag.muted{background:var(--sunk);color:var(--muted)}
.tag.held{background:transparent;color:var(--red);border:1.5px dashed var(--red)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none;margin-right:.45rem;vertical-align:middle}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1.2rem;padding:.6rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem}
.brand b{display:block;font-size:1.05rem;line-height:1.1}
.brand small{display:block;line-height:1.1}
.logo{position:relative;width:30px;height:30px;border-radius:50%;flex:none;
  background:conic-gradient(var(--jade) 0 24%,transparent 0 26%,var(--jade) 0 36.5%,transparent 0 38.5%,var(--jade) 0 49%,transparent 0 51%,var(--jade) 0 61.5%,transparent 0 63.5%,var(--jade) 0 98%,transparent 0)}
.logo::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.stepper{display:flex;gap:.3rem;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:.45rem;padding:.2rem .7rem .2rem .25rem;border-radius:99px;color:var(--muted)}
.stepper li b{display:block;font-size:.82rem;line-height:1.1;font-weight:600}
.stepper li small{display:block;font-size:.7rem;line-height:1.2}
.stepper .num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:600;border:1.5px solid var(--line)}
.stepper li.cur{background:var(--jade-soft);color:var(--ink)}
.stepper li.cur .num{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.stepper li.done .num{border-color:var(--jade);color:var(--jade)}
.top-right{display:flex;align-items:center;gap:.6rem;margin-left:auto;flex-wrap:wrap}
.as{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.as select{padding:.25rem .4rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);max-width:190px}

/* shell */
.shell{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{padding:1rem .6rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.15rem}
.side button{display:flex;align-items:center;justify-content:space-between;text-align:left;border:0;background:transparent;padding:.55rem .75rem;border-radius:var(--r-m);cursor:pointer;font-weight:500;color:var(--muted)}
.side button:hover{background:var(--sunk);color:var(--ink)}
.side button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--jade)}
.nbadge{background:var(--red);color:#fff;border-radius:99px;font-size:.7rem;padding:0 .4rem;min-width:1.2rem;text-align:center}
.main{padding:1.4rem 1.6rem 3rem;min-width:0}
.vhead{margin-bottom:1rem;max-width:760px}
.lede{color:var(--muted);max-width:68ch}
.stats{display:flex;flex-wrap:wrap;gap:.6rem;margin:0 0 1.2rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:.5rem .85rem;display:flex;align-items:baseline;gap:.5rem}
.stat b{font-size:1.25rem}
.stat span{font-size:.85rem;color:var(--muted)}
.stat.warn b{color:var(--amber)}
.stat.bad b{color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l)}
.scroll{overflow-x:auto;max-width:100%}
.notice{border-radius:var(--r-m);padding:.6rem .9rem;margin:.6rem 0;font-size:.9rem;background:var(--slate-soft);color:var(--ink);border-left:3px solid var(--slate)}
.notice.warn{background:var(--amber-soft);border-color:var(--amber)}
.notice.bad{background:var(--red-soft);border-color:var(--red)}
.notice.ok{background:var(--jade-soft);border-color:var(--jade)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin:1.4rem 0 .6rem;flex-wrap:wrap}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.4rem 0 1rem}
.empty{border:1.5px dashed var(--line);border-radius:var(--r-l);padding:2.2rem 1.6rem;max-width:620px}
.empty h2{font-size:1.2rem;margin-bottom:.3rem}
.empty .btn{margin-top:.8rem}
.empty.small{padding:1rem 1.2rem;margin-top:1rem}

/* tables */
.tbl{border-collapse:collapse;width:100%;font-size:.88rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m)}
.tbl th,.tbl td{padding:.5rem .7rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{font-weight:600;font-size:.8rem;color:var(--muted);background:var(--sunk)}
.tbl .num{text-align:right}
.tbl tr.former td{color:var(--muted)}
.tbl td.acts{white-space:nowrap;text-align:right}

/* availability */
.picker{position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.picker-head{padding:.7rem;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:.45rem}
.picker-head input[type=search],.frow input[type=search]{width:100%;padding:.4rem .6rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg)}
.picker-head .row{display:flex;gap:.3rem;flex-wrap:wrap}
.picker-head .as{display:grid;gap:.2rem}
.picker-head .as select{max-width:none;width:100%}
.picker:has(.fpop){z-index:40}
.fbar{display:flex;gap:.35rem;align-items:stretch}
.fbar input{flex:1;min-width:0}
.fbar .btn.on{border-color:var(--ink)}
.fbadge{background:var(--ink);color:var(--surface);border-radius:99px;font-size:.7rem;padding:0 .4rem;min-width:1.2rem;text-align:center;margin-left:.3rem}
/* beside the staff panel on desktop, so the list it acts on stays usable */
.fpop{position:absolute;top:0;left:calc(100% + .5rem);z-index:30;width:min(340px,calc(100vw - 32px));max-height:min(70vh,540px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 8px 28px rgba(0,0,0,.18);padding:.6rem .75rem 0}
.fpop .hint{margin:.1rem .3rem .4rem}
.fpop,.fpop *{text-align:left}
.fsec{border-top:1px solid var(--line);padding:.15rem 0}
.fsec-h{display:flex;align-items:center;gap:.4rem;width:100%;padding:.4rem .1rem;border:0;background:none;font:inherit;font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;cursor:pointer}
.fsec-h::before{content:'▸';font-size:.7rem;transition:transform .15s}
.fsec-h[aria-expanded="true"]::before{transform:rotate(90deg)}
.fsec-h:hover{color:var(--ink)}
.fsec-h .fbadge{margin-left:.1rem;text-transform:none;letter-spacing:0}
.fsec-b{padding:0 0 .4rem}
.fopt{display:flex;align-items:center;gap:.5rem;padding:.25rem .3rem;font-size:.85rem;cursor:pointer;border-radius:var(--r-s)}
.fopt:hover{background:var(--sunk)}
.fopt input{margin:0;flex:none}
.fopt .t{flex:1;min-width:0}
.fopt .n{flex:none;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.4rem;text-align:right}
.fopt.zero .t{color:var(--muted)}
.selrow{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem .4rem;min-height:1.9rem}
.selrow .selall{display:flex;align-items:center;gap:.45rem;flex:1 0 auto;font-size:.87rem;font-weight:600;cursor:pointer}
.selrow .selall input{margin:0}
.selrow .selall span{white-space:nowrap}
.selrow .btn{flex:none}
.fpop-foot{position:sticky;bottom:0;background:var(--surface);display:flex;align-items:center;gap:.4rem;padding:.5rem 0;border-top:1px solid var(--line)}
.fchips{display:flex;flex-wrap:wrap;gap:.15rem}
.fchips .tag{margin:0;white-space:normal;text-align:left}
.plist{list-style:none;margin:0;padding:.3rem;overflow-y:auto}
.plist label{display:flex;align-items:center;gap:.1rem;padding:.3rem .4rem;border-radius:var(--r-s);cursor:pointer;font-size:.87rem;flex-wrap:wrap}
.plist label:hover{background:var(--sunk)}
.plist input{margin:0 .45rem 0 0}
.plist .nm{flex:1;min-width:0}
.tgrid-wrap{overflow-x:auto;border-radius:var(--r-l);border:1px solid var(--line)}
.tgrid{display:grid;grid-template-columns:78px repeat(7,minmax(104px,1fr));gap:1px;background:var(--line);min-width:820px}
.tgrid>div{background:var(--surface);padding:.3rem .45rem;min-width:0;overflow:hidden}
.tgrid>.tg-cell{overflow:visible}
.tg-corner,.tg-day{background:var(--sunk)!important}
.tg-day b,.tg-period b{display:block;font-size:.85rem;line-height:1.2}
.tg-day small,.tg-period small{display:block;font-size:.7rem;line-height:1.2}
.tg-period{background:var(--sunk)!important}
.tg-cell{display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px}
.tgrid>.tg-cell{padding:.3rem .3rem}
.tg-cell.empty{background:var(--red-soft)!important}
.tg-add{display:inline-flex;align-items:center;height:20px;padding:0 .4rem;border-radius:99px;border:1.5px dashed var(--line);background:transparent;color:var(--muted);font-family:inherit;font-size:.63rem;font-weight:600;line-height:1;cursor:pointer;flex:none}
.tg-add:hover,.tg-add:focus-visible{border-color:var(--ink);color:var(--ink)}
.cand .tag{margin-left:.25rem}
.tg-cnt{width:100%;display:flex;justify-content:space-between;gap:.3rem;font-size:.7rem;color:var(--muted);line-height:1.3;margin-bottom:1px}
.tg-cnt b{color:var(--ink);font-size:.78rem}
.tg-cnt.short b{color:var(--amber)}
.tg-line{display:flex;align-items:baseline;justify-content:space-between;width:100%;gap:.3rem}
.tg-line b{font-size:.95rem}
.tg-line span{font-size:.72rem;color:var(--muted)}
.tg-meter{width:100%;height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.tg-meter i{display:block;height:100%;background:var(--jade)}
/* people on the week calendar: one pill per staff member, labelled with their nickname.
   Fill carries the state; once a position is set, the fill is the position's colour. */
.pp{--pb:var(--surface);--pf:var(--ink);--pbd:var(--muted);position:relative;display:inline-flex;align-items:center;height:20px;padding:0 .32rem;border-radius:99px;border:1.5px solid var(--pbd);background:var(--pb);color:var(--pf);font-family:inherit;font-size:.63rem;font-weight:600;line-height:1;white-space:nowrap;cursor:pointer;flex:none}
.pp.def{border-style:dashed}
.pp.sched{--pb:var(--muted);--pbd:var(--muted);--pf:var(--surface)}
.pp.pos{--pb:var(--c);--pbd:var(--c);--pf:#fff}
.pp.pos2{background:linear-gradient(135deg,var(--c) 50%,var(--c2) 50%)}
.pp.out{outline:2px solid var(--amber);outline-offset:1px}
.pp.cur{outline:2px solid var(--ink);outline-offset:1px}
.pp.static{cursor:default}
.pp-x{position:absolute;left:-1.5px;top:-1.5px;bottom:-1.5px;display:flex;align-items:center;gap:.4rem;padding:0 .65rem;border-radius:99px;border:1.5px solid var(--pbd);background:var(--pb);color:var(--pf);white-space:nowrap;z-index:6;pointer-events:none;clip-path:inset(0 100% 0 0 round 99px);opacity:0;transition:clip-path .22s ease-out,opacity .08s;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.pp.def .pp-x{border-style:dashed}
.pp.pos2 .pp-x{background:var(--c)}
.pp-x.r{left:auto;right:-1.5px;clip-path:inset(0 0 0 100% round 99px)}
.pp:hover .pp-x,.pp:focus-visible .pp-x{clip-path:inset(0 0 0 0 round 99px);opacity:1}
.pp-x small{color:inherit;opacity:.85;font-weight:500;font-size:.66rem}
@media (hover:none){.pp-x{display:none}}
@media (prefers-reduced-motion:reduce){.pp-x{transition:none}}
.plab{display:inline-flex;align-items:center;gap:.3rem}
.plab i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.8rem;color:var(--muted);margin:.5rem 0 0}
.legend span{display:inline-flex;align-items:center;gap:.35rem}

/* schedule */
.daytabs{display:flex;gap:.3rem;overflow-x:auto;padding-bottom:.2rem;margin:.8rem 0 0}
.daytabs button{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:.35rem .8rem;cursor:pointer;text-align:left;flex:none;position:relative}
.daytabs button b{display:block;font-size:.88rem;line-height:1.2}
.daytabs button small{display:block;font-size:.7rem;line-height:1.2}
.daytabs button[aria-selected="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--jade)}
.daytabs .pip{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.cov{border-collapse:separate;border-spacing:3px;min-width:640px}
.cov th{font-size:.78rem;font-weight:600;color:var(--muted);text-align:left;padding:.2rem .3rem}
.cov tbody th b{display:block;color:var(--ink);font-size:.85rem}
.cov tbody th small{display:block;font-size:.7rem;font-weight:400}
.cov td{padding:0}
.cov input{width:64px;padding:.35rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.covcell{width:100%;min-width:92px;border:1px solid transparent;border-radius:var(--r-s);padding:.35rem .5rem;text-align:left;cursor:pointer;background:var(--sunk);line-height:1.2}
.covcell b{display:block;font-size:.95rem}
.covcell small{display:block;font-size:.68rem;color:inherit;opacity:.85}
.covcell:hover{border-color:var(--ink)}
.c-met{background:var(--jade-soft);color:var(--jade)}
.c-under{background:var(--amber-soft);color:var(--amber)}
.c-over{background:var(--slate-soft);color:var(--slate)}
.c-none{background:var(--red-soft);color:var(--red);font-weight:600}
.c-zero{color:var(--muted)}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.tl-row{display:grid;grid-template-columns:260px minmax(0,1fr);align-items:center;border-top:1px solid var(--line);min-height:38px}
.tl-row:first-child{border-top:0}
.tl-name{display:flex;align-items:center;flex-wrap:wrap;padding:.25rem .7rem;font-size:.85rem;min-width:0}
.tl-name .nm{margin-right:.3rem}
.strike{text-decoration:line-through;color:var(--muted)}
.track{position:relative;height:34px;margin-right:.7rem;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:6.25% 100%}
.tl-axis{background:var(--sunk);min-height:26px}
.tl-axis .track{height:26px;background:none}
.tl-axis span{position:absolute;top:4px;font-size:.7rem;color:var(--muted);transform:translateX(-50%)}
.tl-axis span:first-child{transform:none}
.tl-axis span:last-child{transform:translateX(-100%)}
.bar{position:absolute;top:4px;bottom:4px;border-radius:6px;border:1.5px solid var(--jade);background:var(--jade-soft);color:var(--ink);font-size:.72rem;padding:0 .4rem;text-align:left;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar b{font-weight:600}
.bar.draft{background:var(--surface);border-style:dashed}
.bar.out{border-color:var(--amber);background:var(--amber-soft)}
.bar.gone{border-color:var(--red);background:var(--red-soft)}
.bar.noshow{opacity:.45;text-decoration:line-through}
.bar.haspos{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.bar.nopos{border-color:var(--muted);border-style:dashed;background:var(--sunk)}
.bar:hover{filter:brightness(.96)}
.roster{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden}
.rs-row{display:grid;grid-template-columns:230px minmax(0,1fr) 220px;gap:.7rem;align-items:center;padding:.35rem .7rem;border-top:1px solid var(--line)}
.rs-head{background:var(--sunk);border-top:0;font-size:.78rem;font-weight:600;color:var(--muted)}
.rs-grp{padding:.45rem .7rem;background:var(--sunk);border-top:1px solid var(--line);font-size:.8rem;font-weight:600}
.rs-grp small{font-weight:400;margin-left:.3rem}
.rs-name{min-width:0;font-size:.87rem}
.rs-name small{display:block;line-height:1.25}
.rs-cells{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px}
.rs-ph{line-height:1.2}
.rs-ph b{display:block;color:var(--ink);font-size:.82rem}
.rs-ph small{display:block;font-size:.7rem;font-weight:400}
.rs-ph .short{color:var(--red);font-weight:600}
.rc{border:1.5px solid transparent;border-radius:var(--r-s);height:30px;padding:0 .3rem;font-size:.72rem;cursor:pointer;background:var(--sunk);color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.rc:hover{border-color:var(--ink)}
.rc.on{background:var(--jade-soft);color:var(--jade);font-weight:600}
.rc.def{background:transparent;border-style:dashed;border-color:var(--muted);color:var(--ink)}
.rc.asg{background:var(--jade);border-color:var(--jade);color:var(--jade-ink);font-weight:600}
.rc.asg.out{background:var(--amber);border-color:var(--amber);color:var(--surface)}

#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:.6rem 1rem;border-radius:var(--r-m);font-size:.9rem;max-width:min(560px,calc(100vw - 2rem));opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}

@media (max-width:980px){

  @keyframes sup{from{transform:translateY(24px);opacity:0}}

  .scale{flex-wrap:wrap}

}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ---------- fixed configuration (v1) ---------- */
const NAMES=['Nguyễn Thị Mai','Trần Văn Hùng','Lê Thị Hoa','Phạm Minh Tuấn','Hoàng Thị Lan','Võ Quốc Bảo','Đặng Thị Thu','Bùi Văn Nam','Đỗ Thị Hương','Hồ Minh Khang','Ngô Thị Ngọc','Dương Văn Phúc','Lý Thị Kim','Phan Thanh Tùng','Vũ Thị Yến','Trương Gia Huy','Mai Thị Thảo','Huỳnh Văn Lộc','Châu Thị Diễm','Tạ Minh Quân','Lâm Thị Trang','Nguyễn Hoàng Long','Trần Thị Mai','Lê Văn Hùng','Phạm Thị Nhung','Đinh Công Danh','Cao Thị Hạnh','Lương Văn Sơn','Tô Thị Vy','Kiều Minh Đức','Nguyễn Thị Oanh','Trần Quốc Việt','Lê Thị Như','Phạm Văn Khoa','Hoàng Thị Lan','Võ Thị Linh','Đặng Minh Trí','Bùi Thị Hằng','Đỗ Văn Thắng','Hồ Thị Uyên'];
const PERIODS=[{id:0,code:'CA 1',s:420,e:660},{id:1,code:'CA 2',s:660,e:780},{id:2,code:'CA 3',s:780,e:900},{id:3,code:'CA 4',s:900,e:1020},{id:4,code:'CA 5',s:1020,e:1380}];
const DAY_START=420,DAY_END=1380,SPAN=960;
/* Seven positions. Headcount, default rate and experience are kept at this level only;
   sub-positions and attributes describe the work and change no calculation. Colour = position. */
const POS=[
  {id:'QC',vi:'QC',en:'QC',rate:26000,c:'#7A4BC8',det:[{id:'in',vi:'Trong',en:'Inside'},{id:'out',vi:'Ngoài',en:'Outside'}]},
  {id:'CI',vi:'Thu Ngân – Offline',en:'Cashier – In-store',rate:26000,c:'#0B7D8A'},
  {id:'CO',vi:'Thu Ngân – Online',en:'Cashier – Online',rate:26000,c:'#2F64C2'},
  {id:'BA',vi:'Pha chế',en:'Barista',rate:28000,c:'#23804A',det:[{id:'mt',vi:'Trà sữa',en:'Milk tea'},{id:'ma',vi:'Matcha',en:'Matcha'},{id:'te',vi:'Trà',en:'Tea'},{id:'bo',vi:'Bồn',en:'Bồn'}]},
  {id:'SV',vi:'Phục vụ',en:'Server',rate:25000,c:'#BE4F17',det:[{id:'run',vi:'Bưng bàn',en:'Table running',attr:true}]},
  {id:'OC',vi:'Kiểm tra đơn',en:'Order check',rate:25000,c:'#AB2E69'},
  {id:'KI',vi:'Bếp',en:'Kitchen',rate:30000,c:'#7A5530'}];
const DEN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],DEN_L=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DVI=['T2','T3','T4','T5','T6','T7','CN'],DVI_L=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const DATES=['21/09','22/09','23/09','24/09','25/09','26/09','27/09'];
const SKIP=[{id:'vac',en:'On vacation',vi:'Đang nghỉ phép'},{id:'few',en:'Registered too few shifts',vi:'Đăng ký quá ít ca'},{id:'enough',en:'Enough staff already',vi:'Đã đủ người'}];
const STAGE_DATE={registration:'17/09',arranging:'19/09',published:'21/09'};

/* ---------- helpers ---------- */
let S,D=null;
const L=(en,vi)=>S.lang==='vi'?vi:en;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const shm=m=>m%60?hm(m):String(Math.floor(m/60));
const toMin=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const vnd=n=>Math.round(n).toLocaleString('vi-VN')+' ₫';
const hrs=m=>{const h=m/60;let t=Number.isInteger(h)?String(h):h.toFixed(1);if(S.lang==='vi')t=t.replace('.',',');return t+(S.lang==='vi'?' giờ':'h')};
const fold=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase();
const dayS=d=>L(DEN[d],DVI[d]),dayL=d=>L(DEN_L[d],DVI_L[d]);
const posOf=id=>POS.find(x=>x.id===id);
const posName=id=>{const p=posOf(id);return L(p.en,p.vi)};
const detName=(id,k)=>{const o=(posOf(id).det||[]).find(x=>x.id===k);return o?L(o.en,o.vi):''};
// "Parent - child/attribute", e.g. "Pha chế - Matcha, Trà" or plain "Phục vụ"
const posLabel=(id,det)=>{const d=(posOf(id).det||[]).filter(o=>(det||[]).includes(o.id)).map(o=>L(o.en,o.vi));return d.length?`${posName(id)} - ${d.join(', ')}`:posName(id)};
const noPosTxt=()=>L('No position yet','Chưa có vị trí');
const asgLabel=a=>a.positions.length?a.positions.map(p=>posLabel(p,a.det?.[p])).join(' + '):noPosTxt();
const plab=(id,det)=>`<span class="plab" style="--c:${posOf(id).c}"><i></i>${esc(posLabel(id,det))}</span>`;
function suggestNick(name,exceptId){
  const w=name.trim().split(/\s+/),given=w[w.length-1],taken=new Set(S.staff.filter(s=>s.active&&s.id!==exceptId).map(s=>fold(s.nick||'')));
  const opts=[w.length>1?`${given} ${w[0][0].toUpperCase()}`:given];
  if(w.length>2)opts.push(`${given} ${w.slice(0,-1).map(x=>x[0].toUpperCase()).join('')}`);
  for(const o of opts)if(!taken.has(fold(o)))return o;
  for(let i=2;;i++){const o=`${opts[0]} ${i}`;if(!taken.has(fold(o)))return o}
}
const who=id=>S.staff.find(s=>s.id===id);
const act=()=>S.staff.filter(s=>s.active);
const getA=id=>S.asg.find(a=>a.id===id);
const emptyWeek=()=>Array.from({length:7},()=>[false,false,false,false,false]);
const days=n=>S.lang==='vi'?`${n} ngày`:`${n} day${n===1?'':'s'}`;
const tag=(c,t)=>`<span class="tag ${c}">${t}</span>`;
const tr=x=>x==null?'':typeof x==='string'?x:x[S.lang];
function bi(fn){const o=S.lang;S.lang='en';const en=fn();S.lang='vi';const vi=fn();S.lang=o;return{en,vi}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const mkLogin=n=>{const w=fold(n).split(' ');return (w[w.length-1]+'.'+w[0]).replace(/[^a-z0-9.]/g,'')};
const timeOpts=(from,to,sel,step=15)=>{let o='';for(let m=from;m<=to;m+=step)o+=`<option value="${m}" ${m===sel?'selected':''}>${hm(m)}</option>`;return o};

/* ---------- seed ---------- */
function seed(){
  const r=rng(11);
  let lang='en';try{lang=localStorage.getItem('watchtower-lang')||'en'}catch(e){}
  S={lang,role:'admin',view:'schedule',sview:'register',pp:null,meId:'s0',stage:'registration',day:0,lday:0,
     staff:[],avail:{},needs:[],asg:[],skips:{},sel:new Set(),fopen:false,fcol:new Set(),selBase:'all',log:[],search:'',showFormer:false,editNeeds:false,seq:1,
     aday:0,smode:'roster',rsort:'time',rpos:'',rfree:false,narrow:(typeof matchMedia!=='undefined'&&matchMedia('(max-width:760px)').matches)};
  const order=['SV','BA','CI','CO','KI','OC','QC','SV','BA'];
  NAMES.forEach((n,i)=>{
    const main=order[i%order.length],q=new Set([main]);
    if(main!=='KI'&&r()<0.6)q.add(['SV','BA','CI','CO','OC','QC'][Math.floor(r()*6)]);
    if(main==='OC')q.add('CO');
    if(r()<0.15)q.add('SV');
    const rate=r()<0.3?null:25000+Math.floor(r()*4)*2000;
    S.staff.push({id:'s'+i,name:n,given:n.split(' ').pop(),phone:'09'+String(10000000+Math.floor(r()*89999999)),
      quals:POS.map(p=>p.id).filter(p=>q.has(p)),rate,active:true,login:mkLogin(n),pwSetAt:'15/09'});
    S.staff[i].nick=suggestNick(n,S.staff[i].id);
  });
  const NONE=[0,7,15,23,31,38],ALL=[4,19],FEW=[11,27];
  // Split registrations: free in the morning and again in the evening with a gap between, on every day they work
  const SPLIT={3:[1,1,0,1,1],12:[1,0,0,0,1],22:[1,0,1,0,1],30:[0,1,0,1,1],35:[1,1,0,0,1]};
  S.staff.forEach((s,i)=>{
    if(NONE.includes(i)){S.avail[s.id]={mode:'none',days:emptyWeek()};return}
    const days=emptyWeek();
    if(ALL.includes(i))days.forEach(d=>d.fill(true));
    else{
      const off=new Set(),nOff=FEW.includes(i)?4:(r()<0.5?1:2);
      while(off.size<nOff)off.add(Math.floor(r()*7));
      const style=r();
      for(let d=0;d<7;d++){
        if(off.has(d))continue;
        const x=r()<0.75?style:r();
        const pat=x<0.4?[1,1,1,1,1]:x<0.68?[1,1,1,0,0]:x<0.92?[0,0,0,1,1]:[0,1,1,1,0];
        days[d]=(SPLIT[i]||pat).map(Boolean);
      }
    }
    S.avail[s.id]={mode:'set',days};
  });
  for(let d=0;d<7;d++){
    S.needs[d]=PERIODS.map(p=>{
      const b={QC:1,CI:2,CO:2,BA:3,SV:3,OC:1,KI:2};
      if(d>=5){b.SV++;b.BA++}
      if(p.id===1){b.SV++;b.BA++}
      if(p.id===4){b.CO++;b.SV++}
      return b;
    });
  }
  S.sel=new Set(S.staff.map(s=>s.id));
}

/* ---------- domain rules ---------- */
function isAvail(sid,d,p){const a=S.avail[sid];return !a||a.mode==='none'?true:a.days[d][p]}
function regStatus(sid){const a=S.avail[sid];if(!a||a.mode==='none')return 'none';if(a.days.every(r=>r.every(Boolean)))return 'all';return 'partial'}
function dayMin(sid,d){const a=S.avail[sid];if(!a||a.mode==='none')return 0;return a.days[d].reduce((t,v,p)=>t+(v?PERIODS[p].e-PERIODS[p].s:0),0)}
function regSummary(sid){let days=0,full=0,min=0;for(let d=0;d<7;d++){const h=dayMin(sid,d);if(h){days++;min+=h;if(h>=480)full++}}return{days,full,min}}
function belowContract(sid){return regStatus(sid)!=='none'&&regSummary(sid).full<5}
function availWeekText(sid){const r=regStatus(sid);if(r==='none')return L('nothing registered','chưa đăng ký');if(r==='all')return L('every shift, all week','tất cả ca, cả tuần');const m=regSummary(sid);return L(`${m.days} days, ${hrs(m.min)}`,`${m.days} ngày, ${hrs(m.min)}`)}
function availDayText(sid,d){const a=S.avail[sid];if(!a||a.mode==='none')return L('nothing registered','chưa đăng ký');const c=PERIODS.filter(p=>a.days[d][p.id]).map(p=>p.code);return c.length?c.join(', '):L('not available','không rảnh')}
function outside(sid,d,s,e){return PERIODS.some(p=>p.s<e&&p.e>s&&!isAvail(sid,d,p.id))}
function busy(sid,d,s,e,...ex){return S.asg.find(a=>a.staffId===sid&&a.day===d&&!ex.includes(a.id)&&a.start<e&&a.end>s)}
function totalNeed(d,p){return Object.values(S.needs[d][p]).reduce((a,b)=>a+b,0)}
function cov(d,pid,pos){const P=PERIODS[pid];let filled=0,shared=0,partial=0;
  for(const a of S.asg){if(a.day!==d||!a.positions.includes(pos)||a.noShow||!who(a.staffId).active)continue;
    if(a.start<=P.s&&a.end>=P.e){filled++;if(a.positions.length>1)shared++}else if(a.start<P.e&&a.end>P.s)partial++}
  return{filled,shared,partial}}
function anyAvail(d,p){return act().some(s=>isAvail(s.id,d,p))}
function underCount(d){let n=0;PERIODS.forEach(p=>POS.forEach(pos=>{const need=S.needs[d][p.id][pos.id];if(need&&cov(d,p.id,pos.id).filled<need)n++}));return n}
const gateList=()=>act().filter(s=>!S.asg.some(a=>a.staffId===s.id)&&!S.skips[s.id]);
const unstaffed=()=>S.asg.filter(a=>!who(a.staffId).active);
const posList=a=>a.positions.length?a.positions.map(p=>posLabel(p,a.det?.[p])+(p===a.primary&&a.positions.length>1?L(' (primary)',' (chính)'):'')).join(' + '):noPosTxt();
const fmtA=a=>`${who(a.staffId).name}, ${dayS(a.day)} ${DATES[a.day]} ${hm(a.start)}–${hm(a.end)}, ${posList(a)}`;
const rateOf=a=>who(a.staffId).rate??(a.primary?posOf(a.primary).rate:0);
const noPosAsg=()=>S.asg.filter(a=>who(a.staffId).active&&!a.positions.length);
// full-period headcount for one CA, whatever the position: what step 2 (placing people) is checked against
function headCount(d,pid){const P=PERIODS[pid];return S.asg.filter(a=>a.day===d&&!a.noShow&&who(a.staffId).active&&a.start<=P.s&&a.end>=P.e).length}
const shortCells=()=>{let n=0;for(let d=0;d<7;d++)PERIODS.forEach(p=>{if(headCount(d,p.id)<totalNeed(d,p.id))n++});return n};
const weekLoad=sid=>{const l=S.asg.filter(a=>a.staffId===sid);return{n:l.length,min:l.reduce((t,a)=>t+a.end-a.start,0)}};

/* ---------- per-day plan, used by the side panel ----------
   The panel edits one staff member's day as five CA cells. Neighbouring cells with the same
   positions are stored as one assignment; a change of position splits them (A3, A4). Shifts
   with custom times are left alone and edited in the shift dialog. */
const aligned=a=>PERIODS.some(p=>p.s===a.start)&&PERIODS.some(p=>p.e===a.end);
const detCopy=det=>JSON.parse(JSON.stringify(det||{}));
const sig=c=>c?JSON.stringify([[...c.positions].sort(),c.primary||'',Object.keys(c.det||{}).filter(k=>c.det[k].length).sort().map(k=>[k,[...c.det[k]].sort()])]):'';
function dayCells(sid,d){
  const list=S.asg.filter(a=>a.staffId===sid&&a.day===d);
  return PERIODS.map(p=>{const a=list.find(x=>x.start<p.e&&x.end>p.s);return a?{a,lock:!aligned(a),positions:[...a.positions],primary:a.primary,det:detCopy(a.det)}:null});
}
const dayText=(sid,d)=>{const l=S.asg.filter(a=>a.staffId===sid&&a.day===d).sort((a,b)=>a.start-b.start);return l.length?l.map(a=>`${hm(a.start)}–${hm(a.end)} ${asgLabel(a)}`).join('; '):L('no shift','không có ca')};
function applyCells(sid,d,cells,reason){
  const before=bi(()=>dayText(sid,d)),olds=S.asg.filter(a=>a.staffId===sid&&a.day===d&&aligned(a)),used=new Set(),segs=[];
  cells.forEach((c,i)=>{if(!c||c.lock)return;const g=segs[segs.length-1];if(g&&g.to===i-1&&sig(g.c)===sig(c))g.to=i;else segs.push({from:i,to:i,c})});
  for(const g of segs){
    const s=PERIODS[g.from].s,e=PERIODS[g.to].e,free=o=>!used.has(o)&&o.start<e&&o.end>s;
    let a=olds.find(o=>free(o)&&o.start===s&&o.end===e)||olds.find(o=>free(o)&&sig(o)===sig(g.c))||olds.find(free);
    const val={start:s,end:e,positions:[...g.c.positions],primary:g.c.primary||null,det:detCopy(g.c.det)};
    if(a){used.add(a);const b=bi(()=>fmtA(a));Object.assign(a,val);const af=bi(()=>fmtA(a));if(b.en!==af.en)a.history.push({before:b,after:af,reason})}
    else addAsg(sid,d,s,e,val.positions,val.primary,'',val.det);
  }
  S.asg=S.asg.filter(a=>!olds.includes(a)||used.has(a));
  const after=bi(()=>dayText(sid,d)),st=who(sid);
  if(before.en!==after.en)log('owner',bi(()=>L(`Schedule, ${st.name}, ${dayS(d)} ${DATES[d]}`,`Xếp lịch, ${st.name}, ${dayS(d)} ${DATES[d]}`)),before,after,reason||'');
}

function late(a){
  if(a.noShow)return{k:'noshow'};
  if(a.arrival==null)return{k:'default'};
  const m=Math.max(0,a.arrival-a.start),len=a.end-a.start,r=a.res;
  if(r&&r.kind==='ontime')return{k:'cleared',m};
  if(m<=10)return{k:'ontime',m};
  if(m<=15)return{k:'penalty',m,ded:0};
  const ded=2*m;
  if(r&&r.kind==='full')return{k:'deduct',m,ded,resolved:true};
  if(r&&r.kind==='reduced')return{k:'deduct',m,ded:r.minutes,resolved:true};
  if(ded>=len)return{k:'anomaly',m,ded,len};
  return{k:'deduct',m,ded};
}
const isPenalty=l=>l.k==='penalty'||l.k==='deduct';
const dedVnd=(a,l)=>(l.ded||0)/60*rateOf(a);
const anomalies=()=>S.asg.filter(a=>who(a.staffId).active&&late(a).k==='anomaly');
function weekStats(sid){
  const byDay=Array(7).fill(0);let pen=0,pend=0,ded=0;
  for(const a of S.asg.filter(a=>a.staffId===sid)){const l=late(a);if(l.k!=='noshow')byDay[a.day]+=a.end-a.start;if(isPenalty(l))pen++;if(l.k==='anomaly')pend++;ded+=dedVnd(a,l)}
  const full=byDay.filter(m=>m>=480).length,total=byDay.reduce((x,y)=>x+y,0);
  return{full,total,pen,pend,ded,bonus:pend?'pending':pen?'lost':full>=5?'track':'short'};
}
function bonusTag(w){
  if(w.bonus==='pending')return tag('held',L('Bonus on hold','Thưởng tạm giữ'));
  if(w.bonus==='lost')return tag('bad',L('Bonus lost','Mất thưởng'));
  if(w.bonus==='track')return tag('ok',L('On track for 100.000 ₫','Đang đủ điều kiện 100.000 ₫'));
  return tag('muted',L(`${w.full} of 5 days at 8h`,`${w.full}/5 ngày đủ 8 tiếng`));
}
function addAsg(sid,d,s,e,positions,primary,note='',det={}){
  const a={id:'a'+(S.seq++),staffId:sid,day:d,start:s,end:e,positions:[...positions],primary:primary||null,det:detCopy(det),note,
    status:S.stage==='published'?'published':'draft',history:[],arrival:null,res:null,noShow:false};
  S.asg.push(a);return a;
}
function log(actor,what,before,after,reason,key){
  const now=new Date(),t=STAGE_DATE[S.stage]+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  const last=S.log[0];
  if(key&&last&&last.key===key){last.after=after;last.t=t;return}
  S.log.unshift({t,actor,what,before,after,reason,key});
}
const actorName=a=>a==='owner'?L('Owner','Chủ quán'):a==='system'?L('System','Hệ thống'):(who(a)?.name||a);

function sampleDraft(){
  const r=rng(5),cnt={},excl=new Set(['s15','s33','s38']);
  const pool=act().filter(s=>!excl.has(s.id));
  const onDay=(sid,d)=>S.asg.some(a=>a.staffId===sid&&a.day===d);
  const pick=(d,ps,pos,cap)=>{
    const c=pool.filter(s=>s.quals.includes(pos)&&!onDay(s.id,d)&&ps.every(p=>isAvail(s.id,d,p))&&(cnt[s.id]||0)<cap)
      .map(s=>({s,k:(cnt[s.id]||0)+s.quals.length*0.35+r()*0.6})).sort((a,b)=>a.k-b.k);
    return c[0]&&c[0].s;
  };
  const blocks=[{s:420,e:900,ps:[0,1,2],ref:0},{s:900,e:1380,ps:[3,4],ref:3}];
  const extras=[{s:660,e:780,ps:[1],pos:['SV','BA']},{s:1020,e:1380,ps:[4],pos:['CO','SV']}];
  for(let d=0;d<7;d++){
    for(const pid of ['KI','BA','QC','OC','CI','CO','SV'])for(const b of [blocks[d%2],blocks[1-d%2]]){
      const p=POS.find(x=>x.id===pid),need=S.needs[d][b.ref][p.id];
      for(let k=0;k<need;k++){const s=pick(d,b.ps,p.id,5)||pick(d,b.ps,p.id,6);if(s){addAsg(s.id,d,b.s,b.e,[p.id],p.id);cnt[s.id]=(cnt[s.id]||0)+1}}
    }
    for(const x of extras)for(const pos of x.pos){const s=pick(d,x.ps,pos,6);if(s){addAsg(s.id,d,x.s,x.e,[pos],pos);cnt[s.id]=(cnt[s.id]||0)+1}}
  }
  // Staff who registered split shifts get both halves on a few days, as two separate shifts
  const runs=(sid,d)=>{const o=[];PERIODS.forEach(p=>{if(!isAvail(sid,d,p.id))return;const l=o[o.length-1];if(l&&l.e===p.s)l.e=p.e;else o.push({s:p.s,e:p.e})});return o};
  pool.filter(s=>S.avail[s.id].mode==='set').forEach(s=>{
    let n=0;
    for(let d=0;d<7&&n<3;d++){
      const rs=runs(s.id,d);if(rs.length<2)continue;
      const pos=s.quals[0];
      rs.forEach(x=>{if(!busy(s.id,d,x.s,x.e))addAsg(s.id,d,x.s,x.e,[pos],pos)});
      n++;
    }
  });
  [0,2,5].forEach(d=>{
    const oc=S.asg.find(a=>a.day===d&&a.primary==='OC'&&a.start===420&&who(a.staffId).quals.includes('CO'));
    const co=S.asg.find(a=>a.day===d&&a.primary==='CO'&&a.start===420&&a.positions.length===1);
    if(oc&&co){oc.positions.push('CO');S.asg=S.asg.filter(a=>a!==co)}
  });
  // describe the work: a station for most baristas, inside/outside for QC, table running for some servers
  for(const a of S.asg){
    if(a.positions.includes('BA')&&r()<0.8)a.det.BA=r()<0.2?['mt','te']:[['mt','ma','te','bo'][Math.floor(r()*4)]];
    if(a.positions.includes('QC'))a.det.QC=[r()<0.5?'in':'out'];
    if(a.positions.includes('SV')&&r()<0.4)a.det.SV=['run'];
  }
  // the weekend is left at step 2: people placed, positions not yet given
  for(const a of S.asg)if(a.day>=5&&r()<0.45){a.positions=[];a.primary=null;a.det={}}
  log('owner',bi(()=>L('Created a sample draft','Tạo bản nháp mẫu')),'',bi(()=>L(`${S.asg.length} shifts`,`${S.asg.length} ca`)),bi(()=>L('Demo helper','Công cụ demo')));
}

// How one staff member shows in one CA cell: null when they are neither free nor placed there
function ppState(s,d,p){

  let cls=regStatus(s.id)==='none'?' def':'',style='',line;

      const c1=posOf(a.primary||a.positions[0]).c,o=a.positions.find(x=>x!==(a.primary||a.positions[0])),c2=o?posOf(o).c:'';

function calLegend(){

/* Staff selection for the calendar. The ticked staff list is the only state: whoever is ticked shows.

function fGroups(all){

      ['none',L('No position yet','Chưa có vị trí'),s=>!staffAsg(s.id).some(a=>a.positions.length)]]});
  }

function covNarrow(d){
  return '<div class="mlist">'+PERIODS.map(p=>{
    const cells=POS.map(pos=>{
      const need=S.needs[d][p.id][pos.id],c=cov(d,p.id,pos.id);

      return `<button class="covcell mini ${cls}" data-a="newAsg" data-d="${d}" data-p="${p.id}" data-pos="${pos.id}"><b>${c.filled}/${need}</b><small>${posName(pos.id)}${c.shared?', '+L('shared','kiêm'):''}</small></button>`;

}

/* ---------- Owner: lateness ---------- */
function lateTag(a,l){
  switch(l.k){
    case 'default':return tag('muted',L('On time, nothing recorded','Đúng giờ, không cần ghi'));
    case 'ontime':return tag('ok',L(`Arrived ${hm(a.arrival)}, on time`,`Đến lúc ${hm(a.arrival)}, đúng giờ`));
    case 'cleared':return tag('ok',L('Confirmed on time','Đã xác nhận đúng giờ'));
    case 'penalty':return tag('warn',L(`${l.m} min late, late penalty`,`Trễ ${l.m} phút, bị tính đi trễ`));
    case 'deduct':return tag('bad',L(`${l.m} min late, ${l.ded} min deducted`,`Trễ ${l.m} phút, trừ ${l.ded} phút`))+tag('bad',vnd(dedVnd(a,l)));
    case 'anomaly':return tag('held',L(`${l.m} min late, held for your review`,`Trễ ${l.m} phút, tạm giữ chờ bạn xem`));
    case 'noshow':return tag('bad',L('Didn’t work, unpaid','Không đi làm, không tính lương'));
  }
}
function explain(a,l){

    case 'cleared':return L('You confirmed they were on time. No penalty and no deduction.','Bạn đã xác nhận nhân viên đến đúng giờ. Không tính đi trễ, không trừ lương.');
    case 'penalty':return L('Late penalty recorded, so this week’s 100.000 ₫ attendance bonus is lost. Pay isn’t touched until minute 16.','Bị tính đi trễ nên mất thưởng chuyên cần 100.000 ₫ tuần này. Chưa trừ lương cho đến phút thứ 16.');
    case 'deduct':return l.resolved?L(`${l.ded} minutes (${vnd(dedVnd(a,l))}) deducted after your review. The attendance bonus is lost.`,`Trừ ${l.ded} phút (${vnd(dedVnd(a,l))}) sau khi bạn xem xét. Mất thưởng chuyên cần.`)
      :L(`Twice the lateness is deducted: ${l.ded} minutes at ${vnd(rateOf(a))}/h, so ${vnd(dedVnd(a,l))} comes off this week’s pay. The attendance bonus is lost.`,`Trừ gấp đôi thời gian trễ: ${l.ded} phút × ${vnd(rateOf(a))}/giờ, tức ${vnd(dedVnd(a,l))} trừ vào lương tuần. Mất thưởng chuyên cần.`);
    case 'anomaly':return L(`That would deduct ${hrs(l.ded)} from a ${hrs(len)} shift, which usually means a wrong or missing record. Nothing is deducted and no penalty is recorded until you review it. Their bonus is on hold.`,`Như vậy sẽ trừ ${hrs(l.ded)} cho ca ${hrs(len)}, thường là do ghi nhận sai hoặc thiếu. Hệ thống chưa trừ lương và chưa tính đi trễ cho đến khi bạn xem xét. Thưởng tạm giữ.`);
    case 'noshow':return L('Marked as not worked. The shift is unpaid and doesn’t count toward the bonus.','Đã ghi là không đi làm. Ca không tính lương và không tính vào thưởng.');
  }
}
function vLateness(){

    <div class="sc held" style="flex:14"><b>${L('Deduction ≥ shift','Khoản trừ ≥ ca')}</b><small>${L('Held for your review','Tạm giữ chờ bạn xem')}</small></div>
  </div>

    <div class="acts">${l.k==='anomaly'?`<button class="btn sm primary" data-a="resDlg" data-id="${a.id}">${L('Review','Xem xét')}</button>`:''}${l.k==='default'?`<button class="btn sm" data-a="arrDlg" data-id="${a.id}">${L('Record arrival','Ghi giờ đến')}</button>`:`<button class="btn sm" data-a="arrDlg" data-id="${a.id}">${L('Change','Sửa')}</button><button class="btn sm ghost" data-a="arrClear" data-id="${a.id}">${L('Clear','Xóa')}</button>`}</div>

  h+=`</section><section><h2>${L('This week so far','Tuần này đến nay')}</h2>`;
  h+=affected.length?`<div class="scroll" style="margin-top:.5rem"><table class="tbl"><thead><tr><th>${L('Staff','Nhân viên')}</th><th class="num">${L('Penalties','Lần trễ')}</th><th class="num">${L('Deducted','Bị trừ')}</th><th>${L('Attendance bonus','Thưởng chuyên cần')}</th></tr></thead><tbody>${affected.map(s=>{const w=weekStats(s.id);return `<tr><td>${esc(s.name)}</td><td class="num">${w.pen}</td><td class="num">${w.ded?vnd(w.ded):'–'}</td><td>${bonusTag(w)}</td></tr>`}).join('')}</tbody></table></div><p class="hint">${L('The bonus shown is a preview. Confirming it at the weekly close comes in Phase 2.','Thưởng hiển thị chỉ là dự tính. Xác nhận khi chốt tuần thuộc giai đoạn 2.')}</p>`

function staffShell(){
  const me=who(S.meId);
  return `<div class="phone"><h1>${L('Hi','Chào')} ${esc(me.given)}</h1><p class="lede">${L('Week of 21–27 September','Tuần 21–27 tháng 9')}</p>

function sRegister(me){
  const open=S.stage==='registration',r=regStatus(me.id),m=regSummary(me.id);
  let h=open?`<div class="notice ok">${L('Open until Saturday 19/09 at 15:00. Tap the shifts you can work.','Mở đến 15:00 thứ Bảy 19/09. Chạm vào các ca bạn có thể làm.')}</div>`
    :`<div class="notice">${L('Registration closed on Saturday at 15:00 and is now locked. If something has changed, tell the owner on Zalo.','Đăng ký đã đóng lúc 15:00 thứ Bảy và đã khóa. Nếu có thay đổi, hãy báo chủ quán qua Zalo.')}</div>`;
  if(r==='none')h+=`<div class="notice warn">${open?L('You haven’t registered anything. If you leave it that way, you’ll count as free for every shift, every day.','Bạn chưa đăng ký gì. Nếu để trống, bạn sẽ được tính là rảnh tất cả ca, mọi ngày.'):L('You didn’t register, so you count as free for every shift this week.','Bạn chưa đăng ký nên được tính là rảnh tất cả ca trong tuần.')}</div>`;
  else{
    h+=`<div class="sumline"><span>${days(m.days)}</span><span>${L(`${days(m.full)} of 8h+`,`${m.full} ngày đủ 8 tiếng`)}</span><span>${hrs(m.min)}</span></div>`;
    if(m.days<5)h+=`<p class="warn-line">${L('Your contract expects at least 5 working days. You can still submit this; the owner will see it.','Hợp đồng yêu cầu ít nhất 5 ngày làm. Bạn vẫn gửi được, chủ quán sẽ thấy thông tin này.')}</p>`;
    if(open)h+=`<p class="hint">${L('Days you leave empty count as days you can’t work.','Ngày để trống được hiểu là ngày bạn không thể làm.')}</p>`;
  }
  if(open)h+=`<div class="dr-act" style="margin:.7rem 0 .4rem"><button class="btn ${r==='all'?'':'primary'}" data-a="weekAll" ${r==='all'?'disabled':''}>${r==='all'?L('Free all week, registered','Đã đăng ký rảnh cả tuần'):L('I’m free all week','Tôi rảnh cả tuần')}</button>${r!=='none'?`<button class="btn ghost" data-a="weekClear">${L('Clear the week','Xóa cả tuần')}</button>`:''}</div>
  <p class="hint">${L('Registering the whole week is not the same as leaving it blank: the owner can see you confirmed it.','Đăng ký rảnh cả tuần khác với để trống: chủ quán thấy được là bạn đã xác nhận.')}</p>`;
  for(let d=0;d<7;d++){
    const dm=dayMin(me.id,d),row=r==='none'?[0,0,0,0,0]:S.avail[me.id].days[d];
    h+=`<div class="dayrow"><div class="dr-head"><b>${dayL(d)}</b><small>${DATES[d]}</small><span class="dr-h">${dm?hrs(dm):(r==='none'?'':L('Can’t work','Không làm được'))}</span></div>
    <div class="pchips">${PERIODS.map(p=>`<button class="pchip" style="--w:${(p.e-p.s)/60}" aria-pressed="${!!row[p.id]}" data-a="tog" data-d="${d}" data-p="${p.id}" ${open?'':'disabled'} aria-label="${dayL(d)} ${p.code} ${hm(p.s)}–${hm(p.e)}"><b>${p.code}</b><small>${shm(p.s)}–${shm(p.e)}</small></button>`).join('')}</div>
    ${open?`<div class="dr-act"><button class="btn xs" data-a="dayAll" data-d="${d}">${L('Select all shifts','Chọn tất cả ca')}</button>${dm?`<button class="btn xs ghost" data-a="dayClear" data-d="${d}">${L('Clear','Bỏ chọn')}</button>`:''}</div>`:''}
    ${dm&&dm<480?`<p class="warn-line">${L(`${hrs(dm)} is under 8 hours. That’s allowed and the owner will see it.`,`${hrs(dm)} là dưới 8 tiếng. Vẫn được phép, chủ quán sẽ thấy.`)}</p>`:''}</div>`;
  }
  return h+`<p class="hint">${L('Registering means you’re able to work then. The owner decides your actual shifts.','Đăng ký nghĩa là bạn có thể làm vào thời gian đó. Chủ quán sẽ quyết định ca làm thực tế.')}</p>`;
}
function staffMsg(a,l){
  switch(l.k){
    case 'ontime':return L(`Arrived ${hm(a.arrival)}. On time.`,`Đến lúc ${hm(a.arrival)}. Đúng giờ.`);
    case 'cleared':return L('The owner confirmed you were on time.','Chủ quán đã xác nhận bạn đến đúng giờ.');
    case 'penalty':return L(`Arrived ${hm(a.arrival)}, ${l.m} minutes late. This week’s attendance bonus is lost. Your pay isn’t affected.`,`Đến lúc ${hm(a.arrival)}, trễ ${l.m} phút. Mất thưởng chuyên cần tuần này. Lương không bị trừ.`);
    case 'deduct':return L(`Arrived ${hm(a.arrival)}, ${l.m} minutes late. ${l.ded} minutes (${vnd(dedVnd(a,l))}) are deducted and this week’s attendance bonus is lost.`,`Đến lúc ${hm(a.arrival)}, trễ ${l.m} phút. Bị trừ ${l.ded} phút (${vnd(dedVnd(a,l))}) và mất thưởng chuyên cần tuần này.`);
    case 'anomaly':return L(`An arrival of ${hm(a.arrival)} was recorded. The owner is checking it, so nothing has been deducted and your bonus is on hold.`,`Giờ đến được ghi là ${hm(a.arrival)}. Chủ quán đang kiểm tra nên chưa trừ lương, thưởng đang tạm giữ.`);
    case 'noshow':return L('Recorded as not worked. This shift is unpaid.','Được ghi là không đi làm. Ca này không tính lương.');
    default:return '';
  }
}
function sSchedule(me){
  if(S.stage!=='published')return emptyState(L('Your shifts aren’t out yet','Lịch làm chưa được công bố'),L('The owner publishes the week after registration closes. You’ll see your shifts here.','Chủ quán sẽ công bố lịch sau khi đóng đăng ký. Ca của bạn sẽ hiện ở đây.'));
  const mine=S.asg.filter(a=>a.staffId===me.id),w=weekStats(me.id);
  let h=`<div class="sumline"><span>${hrs(w.total)} ${L('scheduled','được xếp')}</span><span>${w.full}/5 ${L('days of 8h+','ngày đủ 8 tiếng')}</span>${bonusTag(w)}</div><p class="hint">${L('Bonus shown is provisional until the week is closed.','Thưởng chỉ là tạm tính cho đến khi chốt tuần.')}</p>`;
  if(!mine.length)h+=`<div class="notice">${L('You have no shifts this week.','Tuần này bạn không có ca nào.')}</div>`;
  for(let d=0;d<7;d++){
    const list=mine.filter(a=>a.day===d).sort((a,b)=>a.start-b.start);
    h+=`<div class="dayrow"><div class="dr-head"><b>${dayL(d)}</b><small>${DATES[d]}</small><span class="dr-h">${list.length?'':L('Off','Nghỉ')}</span></div>`;
    h+=list.map(a=>{const l=late(a),msg=staffMsg(a,l);return `<div class="shift"><div class="t">${hm(a.start)}–${hm(a.end)} <small>${hrs(a.end-a.start)}</small></div><p>${posList(a)}</p>${msg?`<p>${lateTag(a,l)}<br>${msg}</p>`:''}</div>`}).join('');
    h+='</div>';
  }
  return h;
}

function candList(){
  const need=D.primary?[D.primary]:D.positions;
  let list=act().map(s=>({s,out:outside(s.id,D.day,D.start,D.end),qual:!need.length||need.every(p=>s.quals.includes(p)),b:busy(s.id,D.day,D.start,D.end,D.id),days:new Set(S.asg.filter(a=>a.staffId===s.id&&a.id!==D.id).map(a=>a.day)).size,def:regStatus(s.id)==='none'}));

function mGate(){

function mAdd(){

  const d=D.d,p=D.p,P=PERIODS[p];
  const list=act().map(s=>{
    const a=S.asg.find(x=>x.staffId===s.id&&x.day===d&&x.start<P.e&&x.end>P.s),o=S.asg.find(x=>x.staffId===s.id&&x.day===d&&x!==a);
    return{s,a,o,av:isAvail(s.id,d,p),def:regStatus(s.id)==='none'};
  }).map(x=>({...x,reg:!!x.a||x.av})).sort((x,y)=>(x.reg-y.reg)||(!!x.o-!!y.o)||x.s.name.localeCompare(y.s.name,'vi'));
  const rows=list.map(x=>`<button type="button" class="cand" style="width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0;background:none;font:inherit;color:inherit" data-a="addPick" data-id="${x.s.id}" data-name="${esc(fold(x.s.name))}"${x.reg?' data-reg="1"':''}${x.reg&&!D.q?' hidden':''}><span class="nm">${esc(x.s.name)}</span><span>${x.a?tag('muted',L(`Already in this shift ${hm(x.a.start)}–${hm(x.a.end)}`,`Đã xếp ca này ${hm(x.a.start)}–${hm(x.a.end)}`)):x.av?(x.def?tag('info',L('Not registered, counted as free','Chưa đăng ký, tính là rảnh')):tag('ok',L('Registered','Đã đăng ký'))):''}${x.o?tag('muted',L(`Has ${hm(x.o.start)}–${hm(x.o.end)} this day`,`Đã có ca ${hm(x.o.start)}–${hm(x.o.end)} ngày này`)):''}${x.s.quals.length?' '+x.s.quals.map(q=>plab(q)).join(' '):''}</span></button>`).join('');
  const body=`<p>${L('Showing staff who didn’t register this shift. Search by name to find anyone else. Pick someone and they open in the panel beside the calendar with this shift selected, so you can place them and give a position.','Danh sách gồm những người không đăng ký ca này. Tìm theo tên để thấy cả những người khác. Chọn một người, họ sẽ mở ở bảng bên cạnh lịch với ca này đã được chọn, để bạn xếp và gán vị trí.')}</p>
  <div class="notice warn">${L('Placing someone in a shift they didn’t register for is allowed. It’s flagged as outside availability; make sure you’ve agreed it with them.','Xếp người vào ca họ không đăng ký vẫn được phép. Ca sẽ bị đánh dấu ngoài lịch rảnh; hãy chắc chắn đã thống nhất với nhân viên.')}</div>
  <div class="frow tight"><input type="search" placeholder="${L('Find staff','Tìm nhân viên')}" aria-label="${L('Find staff','Tìm nhân viên')}" data-i="candq" value="${esc(D.q)}"></div>
  <div class="cands">${rows}<p class="muted pad" data-none${list.some(x=>!x.reg)||D.q?' hidden':''}>${D.q?L('Nobody matches.','Không có ai phù hợp.'):L('Everyone registered this shift. Search by name to add someone anyway.','Ai cũng đã đăng ký ca này. Tìm theo tên nếu vẫn muốn thêm người.')}</p></div>`;
  return dialog(L(`Add someone to ${P.code}, ${dayL(d)} ${DATES[d]}`,`Thêm người vào ${P.code}, ${dayL(d)} ${DATES[d]}`),body,`<span class="grow"></span>${closeBtn()}`);

function renderModal(){

function filterCands(){
  // data-reg rows (Add dialog) only show when a search matches them; data-none is the "nobody here" line
  const q=fold(D.q||''),els=[...document.querySelectorAll('.cands .cand')];
  els.forEach(el=>el.hidden=q?!el.dataset.name.includes(q):el.dataset.reg==='1');
  const none=document.querySelector('.cands [data-none]');
  if(none){none.hidden=els.some(el=>!el.hidden);none.textContent=q?L('Nobody matches.','Không có ai phù hợp.'):L('Everyone registered this shift. Search by name to add someone anyway.','Ai cũng đã đăng ký ca này. Tìm theo tên nếu vẫn muốn thêm người.')}
}

function setAvail(d,fn){
  const sid=S.meId,A=S.avail[sid],before=bi(()=>availDayText(sid,d));
  if(A.mode==='none'){A.mode='set';A.days=emptyWeek()}
  fn(A.days[d]);
  if(A.days.every(r=>r.every(x=>!x)))A.mode='none';
  log(sid,bi(()=>L(`Availability, ${dayL(d)}`,`Lịch rảnh, ${dayL(d)}`)),before,bi(()=>availDayText(sid,d)),'','av:'+sid+':'+d);
  render();
}
function setWeek(fill){
  const sid=S.meId,A=S.avail[sid],before=bi(()=>availWeekText(sid));
  if(fill){A.mode='set';A.days=Array.from({length:7},()=>[true,true,true,true,true])}
  else{A.mode='none';A.days=emptyWeek()}
  log(sid,bi(()=>L('Availability, whole week','Lịch rảnh, cả tuần')),before,bi(()=>availWeekText(sid)),'','wk:'+sid);
  render();toast(fill?L('Registered for every shift this week.','Đã đăng ký tất cả ca trong tuần.'):L('Cleared. With nothing registered you count as free for every shift.','Đã xóa. Không đăng ký gì thì bạn được tính là rảnh mọi ca.'));
}
function ppApply(fn,msg){
  const P=S.pp,cells=dayCells(P.sid,P.d);
  const next=cells.map((c,i)=>c&&c.lock?c:P.sel[i]?fn(c):c);
  if(S.stage==='published'&&next.some((c,i)=>P.sel[i]&&c&&!c.lock&&!c.positions.length)){P.err=L('The week is published, so every shift needs a position.','Lịch đã công bố nên mọi ca phải có vị trí.');render();return}
  applyCells(P.sid,P.d,next,P.reason);P.err='';render();toast(msg);
}

  publishDlg:()=>openDialog({type:'gate'}),
  gateAssign:ds=>{closeModal();S.view='schedule';S.pp={sid:ds.id,d:S.day,sel:PERIODS.map(p=>isAvail(ds.id,S.day,p.id)),pos:[],det:{},reason:'',err:''};render();window.scrollTo(0,0)},
  gatePos:ds=>{const a=getA(ds.id);closeModal();S.view='schedule';S.day=a.day;S.pp={sid:a.staffId,d:a.day,sel:PERIODS.map(p=>a.start<p.e&&a.end>p.s),pos:[],det:{},reason:'',err:''};render();window.scrollTo(0,0)},
  gateSkip:ds=>{const v=document.querySelector(`[data-skipsel="${ds.id}"]`).value;S.skips[ds.id]=v;const k=SKIP.find(x=>x.id===v);log('owner',bi(()=>L('Skipped for this week','Bỏ qua tuần này')),'',who(ds.id).name,{en:k.en,vi:k.vi});renderModal();render()},
  gateUndo:ds=>{delete S.skips[ds.id];log('owner',bi(()=>L('Undid skip','Hoàn tác bỏ qua')),'',who(ds.id).name,'');renderModal();render()},
  doPublish:()=>{
    if(gateList().length||noPosAsg().length)return;
    S.stage='published';S.asg.forEach(a=>a.status='published');
    const n=new Set(S.asg.filter(a=>who(a.staffId).active).map(a=>a.staffId)).size,c=S.asg.length;
    log('owner',bi(()=>L('Published the week','Công bố lịch tuần')),'',bi(()=>L(`${c} shifts for ${n} staff`,`${c} ca cho ${n} nhân viên`)),'');
    closeModal();render();toast(L(`Published. ${n} staff can now see their shifts.`,`Đã công bố. ${n} nhân viên đã xem được ca của mình.`));
  },
  arrDlg:ds=>{const a=getA(ds.id);openDialog({type:'arr',id:a.id,time:hm(a.arrival??a.start)})},
  arrSave:()=>{
    if(!/^\d\d:\d\d$/.test(D.time||'')){D.err=L('Enter the arrival time.','Hãy nhập giờ đến.');renderModal();return}
    const a=getA(D.id),s=who(a.staffId),arrTxt=()=>a.noShow?L('not worked','không đi làm'):a.arrival==null?L('on time, nothing recorded','đúng giờ, chưa ghi'):L(`arrived ${hm(a.arrival)}`,`đến lúc ${hm(a.arrival)}`);
    const before=bi(arrTxt);a.arrival=toMin(D.time);a.res=null;a.noShow=false;
    log('owner',bi(()=>L(`Arrival, ${s.name}, ${dayS(a.day)} ${hm(a.start)}`,`Giờ đến, ${s.name}, ${dayS(a.day)} ${hm(a.start)}`)),before,bi(arrTxt),'');
    const k=late(a).k;closeModal();render();
    toast(k==='anomaly'?L('Recorded and held for your review. Nothing deducted yet.','Đã ghi nhận và tạm giữ chờ bạn xem. Chưa trừ lương.'):L(`Recorded. ${s.given} sees this on their shift.`,`Đã ghi nhận. ${s.given} sẽ thấy trên ca làm.`));
  },
  arrClear:ds=>{const a=getA(ds.id),s=who(a.staffId);a.arrival=null;a.res=null;a.noShow=false;log('owner',bi(()=>L(`Cleared lateness, ${s.name}, ${dayS(a.day)} ${hm(a.start)}`,`Xóa ghi nhận trễ, ${s.name}, ${dayS(a.day)} ${hm(a.start)}`)),'',bi(()=>L('on time','đúng giờ')),'');render();toast(L('Cleared. Counted as on time.','Đã xóa. Tính là đúng giờ.'))},
  resDlg:ds=>{const a=getA(ds.id);openDialog({type:'res',id:a.id,kind:'ontime',minutes:'',time:hm(a.start),reason:''})},
  resSave:()=>{
    const a=getA(D.id),s=who(a.staffId);
    if(!D.reason.trim()){D.err=L('Add a reason. It’s kept in the activity log.','Hãy nhập lý do. Lý do được lưu vào nhật ký.');renderModal();return}
    const before=bi(()=>L(`${hm(a.arrival)}, held`,`${hm(a.arrival)}, tạm giữ`));
    if(D.kind==='ontime')a.res={kind:'ontime'};
    else if(D.kind==='full')a.res={kind:'full'};
    else if(D.kind==='reduced'){const n=parseInt(D.minutes,10);if(!(n>=0)){D.err=L('Enter the minutes to deduct.','Hãy nhập số phút trừ.');renderModal();return}a.res={kind:'reduced',minutes:n}}
    else if(D.kind==='correct'){if(!/^\d\d:\d\d$/.test(D.time)){D.err=L('Enter the correct time.','Hãy nhập giờ đúng.');renderModal();return}a.arrival=toMin(D.time);a.res=null}
    else if(D.kind==='noshow'){a.noShow=true;a.res={kind:'noshow'}}
    const l=late(a);
    log('owner',bi(()=>L(`Reviewed lateness, ${s.name}, ${dayS(a.day)}`,`Xử lý đi trễ, ${s.name}, ${dayS(a.day)}`)),before,bi(()=>{const t=lateTag(a,l);return t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}),D.reason);
    closeModal();render();toast(l.k==='anomaly'?L('Saved. That time is still out of range, so it stays held.','Đã lưu. Giờ này vẫn bất thường nên tiếp tục tạm giữ.'):L('Decision saved. The week’s bonus is re-checked.','Đã lưu quyết định. Thưởng tuần được tính lại.'));
  },
  staffNew:()=>openDialog({type:'staff',id:null,name:'',nick:'',phone:'',quals:[],rate:'',login:'',pw:tempPw(),savedPw:''}),
  staffEdit:ds=>{const s=who(ds.id);openDialog({type:'staff',id:s.id,name:s.name,nick:s.nick,phone:s.phone,quals:[...s.quals],rate:s.rate??'',login:s.login||'',pw:'',savedPw:''})},
  staffSave:()=>{
    const name=D.name.trim();if(!name){D.err=L('Enter a name.','Hãy nhập họ tên.');renderModal();return}
    const nick=(D.nick||'').trim().replace(/\s+/g,' ')||suggestNick(name,D.id),dup=act().find(x=>x.id!==D.id&&fold(x.nick)===fold(nick));
    if(dup){D.err=L(`“${nick}” is already ${dup.name}’s nickname. Choose another one.`,`“${nick}” đang là biệt danh của ${dup.name}. Hãy chọn biệt danh khác.`);renderModal();return}
    const rate=D.rate===''?null:Math.max(0,parseInt(D.rate,10)||0)||null;
    const quals=POS.map(p=>p.id).filter(p=>D.quals.includes(p));
    const pw=(D.pw||'').trim(),login=(D.login||'').trim()||mkLogin(name),now=STAGE_DATE[S.stage];
    if(D.id){
      const s=who(D.id),fmt=()=>`${s.name} (${s.nick}), ${s.phone}, ${s.login}, ${s.quals.map(posName).join(' + ')||'–'}, ${s.rate?vnd(s.rate):L('position rate','lương theo vị trí')}`;
      const before=bi(fmt);Object.assign(s,{name,nick,given:name.split(' ').pop(),phone:D.phone,quals,rate,login});D.nick=nick;
      if(pw){s.pwSetAt=now;log('owner',bi(()=>L('Set a new password','Đặt mật khẩu mới')),'',s.name,'')}
      log('owner',bi(()=>L('Edited staff account','Sửa tài khoản nhân viên')),before,bi(fmt),'');render();
      if(pw){D.savedPw=pw;D.pw='';renderModal();toast(L('Saved. The new password is shown in the window.','Đã lưu. Mật khẩu mới hiển thị trong cửa sổ.'))}
      else{closeModal();toast(L('Saved.','Đã lưu.'))}
    }else{
      const i=S.staff.length,id='s'+Date.now();
      S.staff.push({id,name,nick,given:name.split(' ').pop(),phone:D.phone,quals,rate,active:true,login,pwSetAt:pw?now:''});
      S.avail[id]={mode:'none',days:emptyWeek()};S.sel.add(id);
      log('owner',bi(()=>L('Created staff account','Tạo tài khoản nhân viên')),'',`${name} (${nick}), ${login}`,'');render();
      D.id=id;D.nick=nick;D.savedPw=pw;D.pw='';D.login=login;renderModal();
      toast(L('Account created. The password is shown in the window.','Đã tạo tài khoản. Mật khẩu hiển thị trong cửa sổ.'));
    }
  },
  genPw:()=>{D.pw=tempPw();D.savedPw='';renderModal()},
  deactDlg:ds=>openDialog({type:'deact',id:ds.id}),
  deactDo:()=>{const s=who(D.id);s.active=false;S.sel.delete(s.id);delete S.skips[s.id];log('owner',bi(()=>L('Deactivated account','Vô hiệu hóa tài khoản')),s.name,'','');closeModal();render();toast(L(`${s.given} can no longer sign in. Their shifts are flagged on the schedule.`,`${s.given} không còn đăng nhập được. Các ca của họ đã được đánh dấu trên lịch.`))},
  weekAll:()=>setWeek(true),
  weekClear:()=>setWeek(false),
  tog:ds=>setAvail(+ds.d,row=>{row[+ds.p]=!row[+ds.p]}),
  dayAll:ds=>setAvail(+ds.d,row=>row.fill(true)),
  dayClear:ds=>setAvail(+ds.d,row=>row.fill(false)),
  close:()=>closeModal(),
  overlay:(ds,t,e)=>{if(e.target===t)closeModal()},
};
const CHG={
  me:t=>{S.meId=t.value;render()},
  selBox:()=>{const st=triState(act());(st==='all'||(st==='mixed'&&S.selBase!=='none')?ACT.selNone:ACT.selAll)()},
  sel:t=>{t.checked?S.sel.add(t.value):S.sel.delete(t.value);const sc=document.querySelector('.plist')?.scrollTop||0;render();const l=document.querySelector('.plist');if(l)l.scrollTop=sc;refocus(`[data-c="sel"][value="${t.value}"]`)},
  // A filter option selects everyone it describes, or deselects them when they are all selected already
  flt:t=>{const [gid,oid]=t.value.split(':'),g=fGroups().find(x=>x.id===gid),m=members(g.o.find(o=>o[0]===oid)),add=triState(m)!=='all';
    m.forEach(s=>add?S.sel.add(s.id):S.sel.delete(s.id));render();refocus(`[data-c="flt"][value="${t.value}"]`)},
  need:t=>{S.needs[+t.dataset.d][+t.dataset.p][t.dataset.pos]=Math.max(0,parseInt(t.value,10)||0)},
  posrate:t=>{const p=POS.find(x=>x.id===t.dataset.pos),o=p.rate;p.rate=Math.max(0,parseInt(t.value,10)||0);S.openRates=true;log('owner',bi(()=>L(`Default rate, ${posName(p.id)}`,`Lương mặc định, ${posName(p.id)}`)),vnd(o),vnd(p.rate),'');render()},
  showFormer:t=>{S.showFormer=t.checked;render()},
  rpos:t=>{S.rpos=t.value;render()},
  rfree:t=>{S.rfree=t.checked;render()},
  rsort:t=>{S.rsort=t.value;render()},
  dnum:t=>{D[t.dataset.f]=+t.value;D.err='';if(D.type==='asg'&&t.dataset.f==='start'&&D.end<=D.start)D.end=Math.min(DAY_END,D.start+60);if(D.type==='swap')D.target='';renderModal()},
  dstr:t=>{D[t.dataset.f]=t.value;D.err='';renderModal()},
  dflag:t=>{D[t.dataset.f]=t.checked;renderModal()},
  dpos:t=>{const id=t.value;if(t.checked){if(!D.positions.includes(id))D.positions.push(id);if(!D.primary||!D.positions.includes(D.primary))D.primary=id}else{D.positions=D.positions.filter(x=>x!==id);delete D.det[id];if(D.primary===id)D.primary=D.positions[0]||null}renderModal()},
  dprim:t=>{D.primary=t.value;renderModal()},
  cand:t=>{D.staffId=t.value;D.err='';renderModal()},
  squal:t=>{D.quals=t.checked?[...D.quals,t.value]:D.quals.filter(x=>x!==t.value)},
};
const INP={
  staffsearch:t=>{S.search=t.value;filterPicker()},
  candq:t=>{D.q=t.value;filterCands()},
  dtext:t=>{D[t.dataset.f]=t.value},
  pptext:t=>{S.pp.reason=t.value},
  arrtime:t=>{D.time=t.value;const p=document.getElementById('arrprev');if(p)p.innerHTML=arrPreview()},
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=ACT[t.dataset.a];if(f)f(t.dataset,t,e)});
document.addEventListener('scroll',e=>{if(e.target.id==='fpop')S.fscroll=e.target.scrollTop},true);
document.addEventListener('click',e=>{if(S.fopen&&!D&&!e.target.closest('.picker,[data-a="fToggle"]')){S.fopen=false;render()}});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('mfold'))S.mfold=e.target.open},true);
document.addEventListener('change',e=>{const t=e.target.closest('[data-c]');if(t&&CHG[t.dataset.c])CHG[t.dataset.c](t)});
document.addEventListener('input',e=>{const t=e.target.closest('[data-i]');if(t&&INP[t.dataset.i])INP[t.dataset.i](t)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(D)closeModal();else if(S.fopen){ACT.fToggle()}else if(S.pp){S.pp=null;render()}return}
  const t=e.target.closest&&e.target.closest('[role=checkbox][data-a]');
  if(t&&(e.key===' '||e.key==='Enter')){e.preventDefault();ACT[t.dataset.a](t.dataset,t,e);const n=document.querySelector(`[data-a="ppRow"][data-i="${t.dataset.i}"]`);if(n)n.focus()}
});

function render(){
  document.documentElement.lang=S.lang;
  if(!who(S.meId)||!who(S.meId).active)S.meId=act()[0].id;
  document.getElementById('app').innerHTML=topbar()+(S.role==='admin'?adminShell():staffShell());
  if(S.search)filterPicker();
  markMixed();
}
seed();render();
if(typeof matchMedia!=='undefined'){const mq=matchMedia('(max-width:760px)');const on=e=>{if(S.narrow!==e.matches){S.narrow=e.matches;render()}};mq.addEventListener?mq.addEventListener('change',on):mq.addListener(on)}
</script>
</body>
</html>
